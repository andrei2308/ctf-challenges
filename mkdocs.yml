site_name: andrei
site_url: https://andrei2308.github.io/ctf-challenges/
site_description: CTF writeups and vulnerability research by andrei. Web, reverse engineering, binary exploitation.
site_author: andrei
edit_uri: ""
copyright: Writeups cover retired or publishable challenges and are for educational use.

# The CTFs entry is expanded at build time by hooks/site.py into one section
# per event with all of its writeups. Add events in the EVENTS list there.
nav:
  - Home: index.md
  - CTFs: ctfs/index.md
  - Vuln Research:
      - vulnerability-research/index.md
      - OpenSSL PKCS12 MAC DoS: vulnerability-research/openssl-pkcs12-mac-iteration-dos.md
  - Achievements: achievements.md
  - whoami: whoami.md

theme:
  name: material
  custom_dir: overrides
  logo: assets/images/logo.svg
  favicon: assets/images/favicon.svg
  font: false
  palette:
    - scheme: slate
      primary: custom
      accent: custom
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.path
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/andrei2308
      name: GitHub

hooks:
  - hooks/site.py

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/console.js

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
